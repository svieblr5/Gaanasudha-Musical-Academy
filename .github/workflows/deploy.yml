name: Deploy portal (self-hosted)

# Deploys the Gaanasudha music portal onto THIS PC, where it actually runs.
# The app is a Windows service ("gaanasudhamusicportal.exe") serving port 3080,
# exposed publicly via ngrok. GitHub-hosted runners can't reach this machine, so
# deployment runs on a self-hosted runner installed on the PC itself.
#
# One-time runner setup (repo Settings > Actions > Runners > New self-hosted runner,
# Windows x64), then run the runner AS A SERVICE under an account allowed to restart
# the portal service (Administrator, or granted service-control rights). Label it
# `self-hosted` + `windows` (defaults) so this workflow targets it.
#
# The runner's own checkout is NOT the live app. The live app lives at LIVE_DIR and
# is what the service executes, so we fast-forward that working copy in place rather
# than copying files around.

on:
  push:
    branches: [master]
  workflow_dispatch: {}   # allow manual "Run workflow" from the Actions tab

concurrency:
  group: deploy-portal
  cancel-in-progress: false   # never interrupt a deploy mid-restart

jobs:
  deploy:
    runs-on: [self-hosted, windows]
    env:
      LIVE_DIR: 'G:\Gaanasudha Musical Academy'
      SERVICE_NAME: 'gaanasudhamusicportal.exe'
      HEALTH_URL: 'http://localhost:3080/healthz'
    steps:
      - name: Update live working copy to this commit
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location -LiteralPath $env:LIVE_DIR
          git fetch origin --prune
          # Hard-reset so the live copy exactly matches the pushed commit.
          git reset --hard $env:GITHUB_SHA
          git rev-parse HEAD

      - name: Install dependencies (npm ci)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location -LiteralPath $env:LIVE_DIR
          npm ci --omit=dev

      - name: Restart portal service
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Restart-Service -Name $env:SERVICE_NAME -Force
          Write-Host "Restarted $env:SERVICE_NAME"

      - name: Health check
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ok = $false
          for ($i = 1; $i -le 15; $i++) {
            try {
              $r = Invoke-WebRequest -UseBasicParsing -Uri $env:HEALTH_URL -TimeoutSec 5
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {
              Start-Sleep -Seconds 2
            }
          }
          if (-not $ok) { throw "Portal did not return 200 at $env:HEALTH_URL after restart" }
          Write-Host "Health check OK: $env:HEALTH_URL"
