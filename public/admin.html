<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site Builder · Gaanasudha CMS</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎨</text></svg>" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/cms/theme.css" />
  <style>
    body { height: 100vh; overflow: hidden; }
    .cms { display: grid; grid-template-rows: auto 1fr; height: 100vh; }

    /* Top bar */
    .cms-top {
      display: flex; align-items: center; gap: 14px; padding: 12px 20px;
      background: var(--panel); border-bottom: 1px solid var(--border); z-index: 10;
    }
    .cms-top .brand { display: flex; align-items: center; gap: 10px; margin: 0; }
    .cms-top .brand .logo { font-size: 24px; }
    .cms-top .brand b { font-size: 17px; letter-spacing: .3px; }
    .cms-top .brand small { color: var(--muted); font-weight: 400; }
    .cms-top .spacer { flex: 1; }
    .cms-top .saved { font-size: 13px; color: var(--muted); }
    .cms-top .saved.dirty { color: var(--gold-2); }

    .cms-body { display: grid; grid-template-columns: 210px 1fr 420px; min-height: 0; }

    /* Section rail */
    .cms-rail { background: var(--bg-2); border-right: 1px solid var(--border); overflow-y: auto; padding: 12px 8px; }
    .cms-rail .sec {
      display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px;
      cursor: pointer; color: var(--muted); font-size: 14px; user-select: none;
    }
    .cms-rail .sec:hover { background: var(--panel); color: var(--text); }
    .cms-rail .sec.active { background: var(--accent); color: #fff; }
    .cms-rail .sec .i { font-size: 17px; width: 22px; text-align: center; }

    /* Editing pane */
    .cms-edit { overflow-y: auto; padding: 22px 26px 60px; }
    .cms-edit h2 { margin: 0 0 4px; }
    .cms-edit .desc { color: var(--muted); font-size: 14px; margin: 0 0 20px; }
    .fgroup { margin-bottom: 18px; }
    .fgroup > label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    .fgroup input[type=text], .fgroup input[type=url], .fgroup textarea, .fgroup select { width: 100%; }
    .fgroup textarea { min-height: 90px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; resize: vertical; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
    .card h3 { margin: 0 0 12px; font-size: 15px; }
    .hint2 { font-size: 12px; color: var(--muted); margin-top: 4px; }

    /* Color grid */
    .color-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .color-item { display: flex; align-items: center; gap: 10px; font-size: 13px; }
    .color-item input[type=color] { width: 40px; height: 34px; padding: 2px; border-radius: 8px; background: var(--bg); border: 1px solid var(--border); }
    .color-item input[type=text] { width: 92px; font-family: ui-monospace, monospace; font-size: 12px; }
    .color-item span { color: var(--muted); }

    /* Palette swatches */
    .palettes { display: flex; flex-wrap: wrap; gap: 10px; }
    .palette { cursor: pointer; border: 2px solid transparent; border-radius: 12px; overflow: hidden; width: 92px; }
    .palette:hover { border-color: var(--accent-2); }
    .palette .sw { height: 34px; display: flex; }
    .palette .sw i { flex: 1; }
    .palette .nm { font-size: 11px; text-align: center; padding: 4px; background: var(--panel-2); }

    /* Toggle switch */
    .switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-size: 14px; }
    .switch input { display: none; }
    .switch .track { width: 42px; height: 24px; border-radius: 999px; background: var(--panel-2); position: relative; transition: background .15s; border: 1px solid var(--border); }
    .switch .track::after { content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--muted); transition: transform .15s, background .15s; }
    .switch input:checked + .track { background: var(--accent); }
    .switch input:checked + .track::after { transform: translateX(18px); background: #fff; }

    /* Range with value bubble */
    .rangewrap { display: flex; align-items: center; gap: 12px; }
    .rangewrap input[type=range] { flex: 1; }
    .rangewrap .val { min-width: 52px; text-align: right; font-variant-numeric: tabular-nums; color: var(--gold-2); }

    /* Nav + pages list editor */
    .list-item { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; }
    .list-item .grab { color: var(--muted); }
    .list-item .li-ico { width: 26px; text-align: center; font-size: 16px; }
    .list-item input.li-label { flex: 1; min-width: 60px; }
    .list-item input.li-sec { width: 120px; }
    .list-item .li-badge { font-size: 11px; color: var(--gold-2); border: 1px solid var(--border); border-radius: 6px; padding: 2px 6px; }
    .list-item .li-btns { display: flex; gap: 4px; }
    .mini { padding: 4px 8px; font-size: 13px; }

    .preview-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--panel); border-bottom: 1px solid var(--border); border-left: 1px solid var(--border); font-size: 13px; color: var(--muted); }
    .cms-preview { border-left: 1px solid var(--border); display: grid; grid-template-rows: auto 1fr; min-height: 0; }
    .cms-preview iframe { width: 100%; height: 100%; border: 0; background: var(--bg); }
    .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .seg button { background: transparent; color: var(--muted); border-radius: 0; padding: 5px 10px; font-size: 12px; }
    .seg button.on { background: var(--accent); color: #fff; }

    @media (max-width: 1100px) { .cms-body { grid-template-columns: 190px 1fr; } .cms-preview, .preview-head { display: none; } }
  </style>
</head>
<body>
  <div class="cms" id="cms" style="display:none">
    <div class="cms-top">
      <p class="brand"><span class="logo">🎨</span> <b>Site Builder</b> <small>Gaanasudha CMS</small></p>
      <span class="spacer"></span>
      <span class="saved" id="savedState">Loaded</span>
      <button class="ghost tiny" id="btnPreview">↻ Refresh preview</button>
      <button class="ghost tiny" id="btnExport">⬇ Export</button>
      <button class="ghost tiny" id="btnImport">⬆ Import</button>
      <button class="ghost tiny danger" id="btnReset">Reset all</button>
      <button class="gold" id="btnSave">💾 Save changes</button>
      <a href="/"><button class="ghost tiny">Exit</button></a>
    </div>
    <div class="cms-body">
      <div class="cms-rail" id="rail"></div>
      <div class="cms-edit" id="edit"></div>
      <div class="cms-preview">
        <div class="preview-head">
          <span>Live preview</span>
          <span class="spacer" style="flex:1"></span>
          <span class="seg">
            <button data-pw="desktop" class="on" id="pwDesktop">🖥 Desktop</button>
            <button data-pw="mobile" id="pwMobile">📱 Mobile</button>
          </span>
        </div>
        <div style="overflow:auto;display:grid;place-items:start center;background:var(--bg-2)">
          <iframe id="preview" src="/" title="Live preview"></iframe>
        </div>
      </div>
    </div>
  </div>

  <div id="gate" style="display:grid;place-items:center;height:100vh">
    <div class="card" style="max-width:380px;text-align:center">
      <h3 id="gateMsg">Checking access…</h3>
      <p class="sub" id="gateSub" style="color:var(--muted)"></p>
    </div>
  </div>

  <input type="file" id="mediaInput" accept="image/*" style="display:none" />
  <input type="file" id="importInput" accept="application/json,.json" style="display:none" />
  <div class="toast" id="toast"></div>

  <script src="/js/admin-cms.js"></script>
</body>
</html>
